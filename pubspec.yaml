name: falaai_app
description: "App do FalaAí: mensageiro com criptografia ponta a ponta."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  async_redux: ^29.2.3
  go_router: ^17.2.3
  flutter_secure_storage: ^10.3.4
  path_provider: ^2.1.5
  flutter_localizations:
    sdk: flutter
  intl: any
  falaai_core:
    git:
      url: https://github.com/falaai-br/falaai-core.git
      ref: 6ea44dfc04519dd95f10d4505f3ac415a3c0d19f
      path: dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
